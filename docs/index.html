re_weeks": 3, "target_funds": ["Big Pi Ventures", "Marathon VC", "Metavallon VC", "Velocity Partners", "egg / Eurobank"]};
const LABELS = { funding: "Funding", grants: "EU grant", jobs: "Hiring", github: "GitHub", press: "Press" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
let active = null, fund = "";
const FUNDS = Object.fromEntries(DATA.companies.map(c => [c.company_id, c.greek_funds || []]));
const inFund = id => !fund || FUNDS[id].includes(fund);
const PARTS = [["funding", "Funding", "var(--funding)"], ["grants", "EU grants", "var(--grants)"], ["press", "Press", "var(--press)"], ["hiring", "Hiring", "var(--jobs)"], ["github", "GitHub", "var(--github)"]];
const fundChips = r => (r.greek_funds || []).map(f => `<span class="chipf">${esc(f)}</span>`).join("") +
  (r.greek_fund_status && r.greek_fund_status !== "current" ? ` <span class="dim">${esc(r.greek_fund_status)}</span>` : "");

document.getElementById("sub").textContent =
  `Changes from ${DATA.window_start.slice(0, 10)} to ${DATA.generated_at.slice(0, 10)} (UTC) across ${DATA.companies.length} companies from the Greek Deep Tech Market Map.`;
if (DATA.first_run) {
  const n = document.getElementById("note");
  n.hidden = false;
  n.textContent = "First run: there is no earlier snapshot, so only items dated inside the window are shown. Star changes and closed roles start with the next weekly run.";
}

function renderTiles() {
  const t = document.getElementById("tiles");
  t.innerHTML = Object.entries(LABELS).map(([k, l]) => {
    const n = DATA.changes.filter(c => c.signal === k && inFund(c.company_id)).length;
    return `<button class="tile" data-k="${k}" aria-pressed="${active === k}"><div class="n">${n}</div><div class="l">${l}</div></button>`;
  }).join("") + `<div class="tile" style="cursor:default"><div class="n">${new Set(DATA.changes.filter(c => inFund(c.company_id)).map(c => c.company_id)).size}</div><div class="l">Companies with changes</div></div>`;
  t.querySelectorAll("button").forEach(b => b.onclick = () => { active = active === b.dataset.k ? null : b.dataset.k; renderTiles(); renderFeed(); });
}

function renderFeed() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const items = DATA.changes.filter(c => (!active || c.signal === active) && inFund(c.company_id) &&
    (!q || [c.company, c.category, c.title, c.detail].join(" ").toLowerCase().includes(q)));
  const groups = {};
  items.forEach(c => (groups[c.company] ??= []).push(c));
  const html = Object.keys(groups).sort().map(name => {
    const rows = groups[name];
    return `<div class="co"><h3>${esc(name)} <span class="cat">${esc(rows[0].category)}</span></h3><ul>` +
      rows.map(c => `<li><span class="date">${esc(c.date)}</span><span class="tag ${c.signal}">${LABELS[c.signal]}</span>
        <span><a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">${esc(c.title)}</a>${c.detail ? ` <span class="detail">· ${esc(c.detail)}</span>` : ""}</span></li>`).join("") +
      `</ul></div>`;
  }).join("");
  document.getElementById("feed").innerHTML = html || `<div class="empty">No changes match.</div>`;
}

function renderMovers() {
  const list = DATA.movers.filter(m => m.momentum > 0 && inFund(m.company_id)).slice(0, 10);
  const max = Math.max(1, ...list.map(m => m.momentum));
  document.getElementById("movers").innerHTML = list.map(m => {
    const segs = PARTS.filter(([k]) => m.parts[k]).map(([k, l, col]) =>
      `<span style="width:${m.parts[k] / max * 100}%;background:${col}" title="${l} ${m.parts[k]}"></span>`).join("");
    const earlier = m.momentum - m.week_score;
    const prior = earlier > 0 ? `<span style="width:${earlier / max * 100}%;background:var(--line)" title="Earlier weeks ${earlier}"></span>` : "";
    const drv = PARTS.filter(([k]) => m.parts[k]).map(([k, l]) => `${l} ${m.parts[k]}`).join(" · ") + (earlier > 0 ? ` · earlier weeks ${earlier}` : "");
    return `<div class="mv"><span class="rk">${m.rank}</span>
      <span class="nm">${esc(m.company)}<span class="fd">${m.greek_funds.length ? m.greek_funds.map(esc).join(", ") : esc(m.category)}</span></span>
      <span class="bw"><div class="bar">${segs}${prior}</div><div class="drv">${drv}</div></span>
      <span class="sc">${+m.momentum.toFixed(2)}</span></div>`;
  }).join("") || `<div class="empty">No scored movers${fund ? " in this fund's portfolio" : ""} this week.</div>`;
  document.getElementById("mlegend").innerHTML = PARTS.map(([, l, col]) => `<span><i style="background:${col}"></i>${l}</span>`).join("") +
    `<span><i style="background:var(--line)"></i>Earlier weeks (decayed)</span><span>Score = momentum; rules in the README. Based on ${DATA.score_weeks} weekly run${DATA.score_weeks === 1 ? "" : "s"}.</span>`;
}

const COLS = [
  ["company", "Company"], ["greek_funds", "Greek funds"], ["momentum", "Momentum"], ["category", "Category"], ["links", "Links"],
  ["open_roles", "Open roles"], ["stars", "GitHub stars"], ["last_push", "Last push"], ["eu_projects", "EU projects (since 2024)"], ["latest_funding", "Latest funding headline (90 days)"]
];
let sortKey = "company", sortDir = 1;
function renderTable() {
  const thead = document.querySelector("#tbl thead"), tbody = document.querySelector("#tbl tbody");
  thead.innerHTML = "<tr>" + COLS.map(([k, l]) => `<th data-k="${k}">${l}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>";
  thead.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k; if (k === "links") return;
    sortDir = sortKey === k ? -sortDir : (["open_roles", "stars", "last_push", "momentum", "eu_projects"].includes(k) ? -1 : 1); sortKey = k; renderTable();
  });
  const val = (r, k) => k === "latest_funding" ? (r.latest_funding?.date || "") : k === "greek_funds" ? (r.greek_funds || []).join(",") : (r[k] ?? -1);
  const rows = DATA.companies.filter(r => inFund(r.company_id)).sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  tbody.innerHTML = rows.map(r => {
    const links = [
      r.website && `<a href="${esc(safeUrl(r.website))}" target="_blank" rel="noopener">Site</a>`,
      r.linkedin_url && `<a href="${esc(safeUrl(r.linkedin_url))}" target="_blank" rel="noopener">LinkedIn</a>`,
      r.github_org && `<a href="https://github.com/${esc(r.github_org)}" target="_blank" rel="noopener">GitHub</a>`,
      r.careers_url && `<a href="${esc(safeUrl(r.careers_url))}" target="_blank" rel="noopener">Careers</a>`
    ].filter(Boolean).join("");
    const roles = r.open_roles == null ? `<span class="dim">–</span>` : `${r.open_roles}${r.jobs_source === "careers_page" ? "*" : ""}`;
    const f = r.latest_funding;
    return `<tr><td>${esc(r.company)}${r.map_status === "Borderline" ? ' <span class="dim">(borderline)</span>' : ""}</td>
      <td>${fundChips(r) || '<span class="dim">–</span>'}</td>
      <td class="num">${r.momentum ? +r.momentum.toFixed(2) : '<span class="dim">0</span>'}</td>
      <td class="dim">${esc(r.category)}</td><td class="links">${links}</td>
      <td class="num">${roles}</td><td class="num">${r.github_org ? r.stars : '<span class="dim">–</span>'}</td>
      <td class="dim nowrap">${esc(r.last_push)}</td>
      <td class="num">${r.eu_projects ? `<a href="${esc(safeUrl(r.latest_grant.url))}" target="_blank" rel="noopener" title="Latest: ${esc(r.latest_grant.title)}">${r.eu_projects}</a>` : '<span class="dim">–</span>'}</td>
      <td>${f ? `<span class="dim">${esc(f.date)}</span> <a href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener">${esc(f.title)}</a> <span class="dim">${esc(f.source)}</span>` : '<span class="dim">–</span>'}</td></tr>`;
  }).join("");
}

document.getElementById("q").addEventListener("input", renderFeed);
document.getElementById("foot").innerHTML =
  `Generated ${esc(DATA.generated_at)}. * = counted from the careers page (heuristic), not a job-board API. Digests: ` +
  DATA.history.map(d => `<a href="https://github.com/geve-ops/vc-dealflow-tracker/blob/main/digests/${esc(d)}.md">${esc(d)}</a>`).join(", ") +
  `. Signals and their limits are described in the README.`;
const fsel = document.getElementById("fund");
const counts = {};
DATA.companies.forEach(c => (c.greek_funds || []).forEach(f => counts[f] = (counts[f] || 0) + 1));
const others = Object.keys(counts).filter(f => !DATA.target_funds.includes(f)).sort();
fsel.innerHTML = `<option value="">All companies (${DATA.companies.length})</option>` +
  `<optgroup label="Target funds">` + DATA.target_funds.map(f => `<option value="${esc(f)}"${counts[f] ? "" : " disabled"}>${esc(f)} (${counts[f] || 0})</option>`).join("") + `</optgroup>` +
  `<optgroup label="Other Greek funds">` + others.map(f => `<option value="${esc(f)}">${esc(f)} (${counts[f]})</option>`).join("") + `</optgroup>`;
fsel.onchange = () => {
  fund = fsel.value;
  document.getElementById("fundinfo").textContent = fund ? `Showing ${counts[fund]} portfolio companies, from the market map's investors column.` : "";
  renderTiles(); renderMovers(); renderFeed(); renderTable();
};
renderTiles(); renderMovers(); renderFeed(); renderTable();
