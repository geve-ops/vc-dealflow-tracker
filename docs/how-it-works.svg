<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>How the deal-flow tracker works</title>
<desc>The market map dataset builds a 69-company watchlist. Three signals (GitHub, funding news, jobs) are collected every Monday into a snapshot, compared with last week and scored. Outputs are the weekly digest, the dashboard and the monthly briefing, which also reads the hand-kept pipeline file.</desc>
<style>
  .bg { fill: #ffffff; }
  .n rect { fill: #f1efe8; stroke: #888780; }
  .s rect { fill: #eeedfe; stroke: #534ab7; }
  .o rect { fill: #e1f5ee; stroke: #0f6e56; }
  .h rect { fill: #faeeda; stroke: #854f0b; stroke-dasharray: 4 3; }
  .t { fill: #1c1d1f; font-size: 14px; font-weight: 600; }
  .d { fill: #5f5e5a; font-size: 12px; }
  .a { stroke: #888780; stroke-width: 1.2; fill: none; }
  .ah { fill: #888780; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #141517; }
    .n rect { fill: #2c2c2a; stroke: #b4b2a9; }
    .s rect { fill: #26215c; stroke: #afa9ec; }
    .o rect { fill: #04342c; stroke: #5dcaa5; }
    .h rect { fill: #412402; stroke: #ef9f27; }
    .t { fill: #ececec; }
    .d { fill: #b4b2a9; }
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M1 1L9 5L1 9z"/></marker></defs>
<rect class="bg" width="680" height="540" rx="12"/>
<g class="n"><rect x="240" y="20" width="200" height="56" rx="8"/><text class="t" x="340" y="43" text-anchor="middle">Market map dataset</text><text class="d" x="340" y="62" text-anchor="middle">88 screened, sources per row</text></g>
<line class="a" x1="340" y1="76" x2="340" y2="98" marker-end="url(#ar)"/>
<g class="n"><rect x="240" y="100" width="200" height="56" rx="8"/><text class="t" x="340" y="123" text-anchor="middle">Watchlist</text><text class="d" x="340" y="142" text-anchor="middle">69 companies, Greek fund tags</text></g>
<line class="a" x1="320" y1="156" x2="160" y2="186" marker-end="url(#ar)"/>
<line class="a" x1="340" y1="156" x2="340" y2="186" marker-end="url(#ar)"/>
<line class="a" x1="360" y1="156" x2="520" y2="186" marker-end="url(#ar)"/>
<g class="s"><rect x="60" y="188" width="170" height="56" rx="8"/><text class="t" x="145" y="211" text-anchor="middle">GitHub activity</text><text class="d" x="145" y="230" text-anchor="middle">Repos, commits, stars</text></g>
<g class="s"><rect x="255" y="188" width="170" height="56" rx="8"/><text class="t" x="340" y="211" text-anchor="middle">Funding news</text><text class="d" x="340" y="230" text-anchor="middle">Google News, EN + GR</text></g>
<g class="s"><rect x="450" y="188" width="170" height="56" rx="8"/><text class="t" x="535" y="211" text-anchor="middle">Job postings</text><text class="d" x="535" y="230" text-anchor="middle">Job boards, careers pages</text></g>
<line class="a" x1="160" y1="244" x2="320" y2="278" marker-end="url(#ar)"/>
<line class="a" x1="340" y1="244" x2="340" y2="278" marker-end="url(#ar)"/>
<line class="a" x1="520" y1="244" x2="360" y2="278" marker-end="url(#ar)"/>
<g class="n"><rect x="240" y="280" width="200" height="56" rx="8"/><text class="t" x="340" y="303" text-anchor="middle">Weekly snapshot</text><text class="d" x="340" y="322" text-anchor="middle">Mondays 06:00 UTC</text></g>
<line class="a" x1="340" y1="336" x2="340" y2="358" marker-end="url(#ar)"/>
<g class="o"><rect x="240" y="360" width="200" height="56" rx="8"/><text class="t" x="340" y="383" text-anchor="middle">Compare and score</text><text class="d" x="340" y="402" text-anchor="middle">Changes, momentum</text></g>
<g class="h"><rect x="470" y="360" width="170" height="56" rx="8"/><text class="t" x="555" y="383" text-anchor="middle">pipeline.csv</text><text class="d" x="555" y="402" text-anchor="middle">Kept by hand</text></g>
<line class="a" x1="320" y1="416" x2="160" y2="458" marker-end="url(#ar)"/>
<line class="a" x1="340" y1="416" x2="340" y2="458" marker-end="url(#ar)"/>
<line class="a" x1="360" y1="416" x2="515" y2="458" marker-end="url(#ar)"/>
<line class="a" x1="555" y1="416" x2="550" y2="458" marker-end="url(#ar)"/>
<g class="o"><rect x="60" y="460" width="170" height="56" rx="8"/><text class="t" x="145" y="483" text-anchor="middle">Weekly digest</text><text class="d" x="145" y="502" text-anchor="middle">Markdown, source per line</text></g>
<g class="o"><rect x="255" y="460" width="170" height="56" rx="8"/><text class="t" x="340" y="483" text-anchor="middle">Dashboard</text><text class="d" x="340" y="502" text-anchor="middle">Movers, fund filter</text></g>
<g class="o"><rect x="450" y="460" width="170" height="56" rx="8"/><text class="t" x="535" y="483" text-anchor="middle">Monthly briefing</text><text class="d" x="535" y="502" text-anchor="middle">KPIs, matrix, memos</text></g>
</svg>
